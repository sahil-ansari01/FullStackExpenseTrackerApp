<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-400 via-pink-500 to-red-500">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Reset Password</h2>
            <form id="resetPasswordForm" class="space-y-4" onsubmit="resetPassword(event)">
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-600">New Password</label>
                    <input type="password" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" name="password" id="password" placeholder="Enter new password">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-semibold text-gray-600">Confirm New Password</label>
                    <input type="password" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" name="confirmPassword" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <div>
                    <button type="submit" class="w-full bg-purple-600 text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-500 focus:outline-none focus:bg-purple-500">Reset Password</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.4/axios.min.js"></script>
    <script>
        async function resetPassword(event) {
            const token = localStorage.getItem('token');
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            const resetRequestId = window.location.pathname.split('/').pop();

            try {
                const res = await axios.post(`http://3.85.228.232:3000/resetpassword/${resetRequestId}`, { password }, { headers: { 'Authorization': token }});
                alert(res.data.message);
                window.location.href = '/user/login';
            } catch (err) {
                console.log(err);
            }
        }
    </script>
</body>
</html>
