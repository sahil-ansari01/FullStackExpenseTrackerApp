<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/expense.css">
  <!-- font awesome cdns -->
 <link rel="stylesheet" href=" https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-100">

<!-- Navigation Bar -->
<nav class="bg-white shadow-md">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <div class="text-xl font-semibold text-gray-800">Expense Tracker</div>
    <div class="hidden lg:flex space-x-4">
      <a href="#" class="text-gray-800 hover:text-purple-600">Dashboard</a>
      <a href="#" id="leaderboardNav" class="text-gray-800 hover:text-purple-600" style="display: none;">Leaderboard</a>
      <a href="login.html" class="text-gray-800 hover:text-purple-600">LogOut</a>
    </div>
    <div class="lg:hidden">
      <button id="menuButton" class="text-gray-800 hover:text-purple-600 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>
  <div id="mobileMenu" class="hidden lg:hidden">
    <a href="#" class="block px-4 py-2 text-gray-800 hover:bg-purple-600 hover:text-white">Dashboard</a>
    <a href="#" id="showLeaderboardNav" class="block px-4 py-2 text-gray-800 hover:bg-purple-600 hover:text-white">Leaderboard</a>
    <a href="login.html" class="block px-4 py-2 text-gray-800 hover:bg-purple-600 hover:text-white">LogOut</a>
  </div>
</nav>

<!-- Expense Form -->
<div class="container mx-auto mt-1 px-4 lg:px-0 flex justify-center" id="tablesContainer">
  <div class="max-w-4xl w-full bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-4 text-center text-gray-800">Add Expense</h2>
    <form id="expenseForm" class="space-y-4">
      <div class="flex space-x-4">
        <div class="flex-1">
          <label for="spentAmount" class="block text-sm font-semibold text-gray-600">Money Spent</label>
          <input type="number" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="spentAmount" placeholder="Enter amount">
        </div>
        <div class="flex-1">
          <label for="description" class="block text-sm font-semibold text-gray-600">Description</label>
          <input type="text" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="description" placeholder="Enter description">
        </div>
        <div class="flex-1">
          <label for="category" class="block text-sm font-semibold text-gray-600">Category</label>
          <select class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="category">
            <option value="Household">Household</option>
            <option value="Transportation">Transportation</option>
            <option value="Food">Food</option>
            <option value="Clothes & Wear">Clothes & Wear</option>
            <option value="Health & Fitness">Health & Fitness</option>
            <option value="Personal Care">Personal Care</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Education">Education</option>
            <option value="Financial Obligations">Financial Obligations</option>
            <option value="Gifts & Donations">Gifts & Donations</option>
            <option value="Miscellaneous">Miscellaneous</option>
            <!-- Add more categories here -->
          </select>
        </div>
      </div>
      <div class="flex space-x-4">
        <button type="submit" class="flex-1 btn-primary text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Add Expense</button>
      </div>
    </form>
    <div class="flex space-x-4 mt-4">
      <button id="rzp-button1" class="flex-1 btn-primary text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Buy Premium</button>
      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
      <button id="showLeaderboardBtn" class="flex-1 btn-primary text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600" style="display:none;">Leaderboard</button>
    </div>
  </div>
</div>

<!-- Leaderboard -->
<div class="container mx-auto mt-1 px-4 lg:px-0 flex justify-center" id="tablesContainer">
  <div class="max-w-4xl w-full bg-white p-8 mx-1 rounded-lg shadow-md" id="leaderboardTable" style="display:none;">
    <h2 class="text-2xl font-semibold mb-4 text-center text-gray-800">Leaderboard</h2>
    <table class="w-full">
      <thead>
        <tr>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Name</th>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Total Expenses</th>
        </tr>
      </thead>
      <tbody id="leaderboardTableBody">
        <!-- Leaderboard rows will be dynamically added here -->
      </tbody>
    </table>
    <div class="flex justify-center mt-2" id="leaderboardPagination">
      <button id="leaderboardPrevPage" class="px-4 py-2 rounded-l"><span class="fa fa-arrow-circle-left mr-2" aria-hidden="true"></span></button>
      <span id="leaderboardPageNumber" class="px-4 py-2 bg-gray-200">1</span>
      <button id="leaderboardNextPage" class="px-4 py-2 rounded-r"><span class="fa fa-arrow-circle-right mr-2" aria-hidden="true"></span></button>
    </div>
  </div>
</div>

<div class="container mx-auto mt-1 px-4 lg:px-0 flex justify-center">
  <div class="max-w-4xl w-full bg-white p-8 rounded-lg shadow-md">
    <!-- <div class="view-type-buttons flex justify-center space-x-4 mb-4" id="viewTypeButtons">
      <button id="dailyView" class="btn-primary text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Daily</button>
      <button id="weeklyView" class="btn-primary text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Weekly</button>
      <button id="monthlyView" class="btn-primary text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600">Monthly</button>
    </div>     -->
    <h2 class="text-2xl font-semibold mb-4 text-center text-gray-800">Expense Table</h2>
    <div class="flex justify-end mb-4">
      <label for="rowsPerPage" class="block text-sm font-semibold text-gray-600 mr-2">Rows per page:</label>
      <select class="px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="rowsPerPage">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="150">150</option>
        <option value="200">200</option>
        <!-- Add more options here -->
      </select>
    </div>
    <table class="w-full">
      <thead>
        <tr>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Amount</th>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Description</th>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Category</th>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Action</th>
        </tr>
      </thead>
      <tbody id="expenseTableBody">
        <!-- Expense rows will be dynamically added here -->
      </tbody>
    </table>

    <div class="flex justify-center mt-2" id="expenseTablePagination">
      <button id="expenseTablePrevPage" class="px-4 py-2 rounded-l"><span class="fa fa-arrow-circle-left mr-2" aria-hidden="true"></span></button>
      <span id="expenseTablePageNumber" class="px-4 py-2 bg-gray-200">1</span>
      <button id="expenseTableNextPage" class="px-4 py-2 rounded-r"><span class="fa fa-arrow-circle-right mr-2" aria-hidden="true"></span></button>
    </div>

    <div class="flex justify-between items-center mt-4">
      <button onclick="download()" class="btn-primary text-white font-semibold rounded-lg px-4 py-2 flex items-center transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600" id="downloadBtn" style="display: none;">
        <span class="fa-solid fa-download mr-2"></span>
        Download
      </button>
      <button id="previousDownloadsBtn" class="btn-primary text-white font-semibold rounded-lg px-4 py-2 flex items-center transition-colors duration-300 ease-in-out transform hover:bg-purple-600 focus:outline-none focus:bg-purple-600" id="previousDownloadsBtn" style="display: none;">
        <span class="fa-solid fa-folder-open mr-2"></span>
        Previous Downloads
      </button>
    </div>
  </div>
</div>

<!-- Previous Downloads Table -->
<div class="container mx-auto mt-1 px-4 lg:px-0 flex justify-center"> 
  <div class="max-w-4xl w-full bg-white p-8 mx-1 rounded-lg shadow-md" id="previousDownloadsTable" style="display: none;">
    <h2 class="text-2xl font-semibold mb-4 text-center text-gray-800">Previous Downloads</h2>
    <table class="w-full">
      <thead>
        <tr>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Date</th>
          <th class="px-4 py-2 text-sm font-semibold text-gray-600">Download Link</th>
        </tr>
      </thead>
      <tbody id="previousDownloadsTableBody">
        <!-- Previous download rows will be dynamically added here -->
      </tbody>
    </table>
    <div class="flex justify-center mt-2" id="previousDownloadsPagination">
      <button id="previousDownloadsPrevPage" class="px-4 py-2 rounded-l"><span class="fa fa-arrow-circle-left mr-2" aria-hidden="true"></span></button>
      <span id="previousDownloadsPageNumber" class="px-4 py-2 bg-gray-200">1</span>
      <button id="previousDownloadsNextPage" class="px-4 py-2 rounded-r"><span class="fa fa-arrow-circle-right mr-2" aria-hidden="true"></span></button>
    </div>    
  </div>
</div>

<!-- Transaction Modals -->
<div id="successModal" class="modal">
  <div class="modal-content">
    <p>Transaction Successful!</p>
    <button id="okButton">OK</button>
  </div>
</div>

<div id="failModal" class="modal">
  <div class="modal-content">
    <p>Transaction Failed!</p>
    <button id="okButtonFailed">OK</button>
  </div>
</div>

<!-- JavaScript to handle form submission, add expenses to table, and delete expenses -->
<script src="../js/expense.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  document.getElementById('menuButton').addEventListener('click', function() {
    var mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenu.classList.contains('hidden')) {
      mobileMenu.classList.remove('hidden');
    } else {
      mobileMenu.classList.add('hidden');
    }
  });
</script>
</body>
</html>
