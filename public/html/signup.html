<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Custom Styles */
    body {
      background-color: #f3f4f6;
    }

    .card {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: #6c5ce7;
    }

    .btn-primary:hover {
      background-color: #4a41e0;
    }
  </style>
</head>
<body class="font-sans antialiased">

<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-400 via-pink-500 to-red-500">
  <div class="max-w-md bg-white rounded-lg shadow-lg p-14">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Signup</h2>
    <form onsubmit="signup(event)" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-600">Email address</label>
        <input type="email" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="email" name="email" placeholder="Enter email" required>
        <p class="text-xs text-gray-500 mt-1">We'll never share your email with anyone else.</p>
      </div>
      <div>
        <label for="name" class="block text-sm font-semibold text-gray-600">Name</label>
        <input type="text" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="name" name="name" placeholder="Enter name" required>
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-600">Password</label>
        <input type="password" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" id="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="w-full bg-purple-600 text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-500 focus:outline-none focus:bg-purple-500">Sign Up</button>
      <a href="../html/login.html" class="block text-center text-purple-600 font-semibold mt-3">Already User? Login</a>
    </form>

    <div class="error text-red-500 mt-3" id="error"></div>
  </div>
</div>

<script src="../js/signup.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.4/axios.min.js"></script>
</body>
</html>
