<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Custom Styles */
    body {
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="font-sans antialiased">

<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-400 via-pink-500 to-red-500">
  <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Login</h2>
    <form onsubmit="login(event)" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-600">Email address</label>
        <input type="email" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" name="email" id="email" aria-describedby="emailHelp" placeholder="Enter email">
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-600">Password</label>
        <input type="password" class="w-full px-4 py-2 rounded-lg bg-gray-100 border focus:border-purple-400 focus:bg-white" name="password" id="password" placeholder="Password">
      </div>
      <button type="submit" id="loginButton" class="w-full bg-purple-600 text-white font-semibold rounded-lg px-4 py-2 transition-colors duration-300 ease-in-out transform hover:bg-purple-500 focus:outline-none focus:bg-purple-500">Login</button>
      <a href="../html/signup.html" class="block text-center text-purple-600 font-semibold mt-3">New User? Signup</a>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.4/axios.min.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
